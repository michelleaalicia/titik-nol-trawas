<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title class="header-title">Detail Wisata</ion-title>

    <div slot="end" class="spacer"></div>
  </ion-toolbar>
</ion-header>

<ion-content class="detail-wisata-content">
  <main class="page-container" *ngIf="wisata; else tidakDitemukan">
    <!-- Foto wisata -->
    <section class="hero-section">
      <div class="hero-image-wrapper">
        <img [src]="wisata.gambar" [alt]="wisata.nama" class="hero-image" />
      </div>
    </section>

    <!-- Satu card informasi, mengikuti halaman Detail Event -->
    <article class="article-card">
      <h1>{{ wisata.nama }}</h1>

      <div class="wisata-description">
        <p>{{ wisata.deskripsi }}</p>
      </div>

      <!-- Informasi wisata -->
      <div class="wisata-info-list">
        <div class="wisata-info-item">
          <ion-icon name="time-outline"></ion-icon>
          <div>
            <strong>Jam Buka</strong>
            <span>{{ wisata.jam }}</span>
          </div>
        </div>

        <div class="wisata-info-item">
          <ion-icon name="pricetag-outline"></ion-icon>
          <div>
            <strong>Harga</strong>
            <span>{{ formatHarga(wisata.harga) }}</span>
          </div>
        </div>

        <div class="wisata-info-item">
          <ion-icon name="location-outline"></ion-icon>
          <div>
            <strong>Alamat</strong>
            <span>{{ wisata.alamat }}</span>
          </div>
        </div>
      </div>

      <!-- Lokasi di peta -->
      <section class="location-section">
        <h2>Lokasi di Peta</h2>
        <p>Lihat lokasi wisata melalui Google Maps.</p>

        <ion-button
          expand="block"
          shape="round"
          color="primary"
          class="location-button"
          (click)="bukaMaps()"
        >
          <ion-icon slot="start" name="map-outline"></ion-icon>
          Lihat Lokasi
        </ion-button>
      </section>
    </article>

    <div class="bottom-space"></div>
  </main>

  <ng-template #tidakDitemukan>
    <main class="page-container">
      <p>Tempat wisata tidak ditemukan.</p>
      <ion-button (click)="goBack()">Kembali</ion-button>
    </main>
  </ng-template>
</ion-content>
