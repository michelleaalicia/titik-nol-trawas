<ion-content class="detail-content">
  <div class="page-container" *ngIf="wisata; else tidakDitemukan">
    <header class="detail-header">
      <button
        type="button"
        class="back-button"
        aria-label="Kembali"
        (click)="goBack()"
      >
        <ion-icon name="arrow-back"></ion-icon>
      </button>

      <span>Detail Wisata</span>

      <div class="header-spacer"></div>
    </header>

    <section class="hero-section">
      <div class="hero-image-wrapper">
        <img
          [src]="wisata.gambar"
          [alt]="wisata.nama"
          class="hero-image"
        />

        <div class="hero-overlay"></div>

        <div class="hero-category">{{ wisata.kategori }}</div>

        <div class="hero-rating" *ngIf="wisata.rating !== null">
          <ion-icon name="star"></ion-icon>
          {{ wisata.rating }}
        </div>
      </div>
    </section>

    <section class="intro-section">
      <h1>{{ wisata.nama }}</h1>

      <div class="location-row">
        <ion-icon name="location-outline"></ion-icon>
        <span>Sekitar Titik Nol Trawas</span>
      </div>
    </section>

    <section class="quick-info">
      <div class="quick-card">
        <div class="quick-icon">
          <ion-icon name="pricetag-outline"></ion-icon>
        </div>

        <div>
          <span>Biaya Kunjungan</span>
          <strong>{{ wisata.harga }}</strong>
        </div>
      </div>

      <div class="quick-card">
        <div class="quick-icon">
          <ion-icon name="time-outline"></ion-icon>
        </div>

        <div>
          <span>Jam Buka</span>
          <strong>{{ wisata.jam }}</strong>
        </div>
      </div>
    </section>

    <section class="content-section">
      <div class="section-heading">
        <h2>Tentang Tempat</h2>
      </div>

      <p class="description">{{ wisata.deskripsi }}</p>
    </section>

    <section class="content-section">
      <div class="section-heading">
        <h2>Lokasi</h2>
      </div>

      <div class="location-card">
        <div class="location-icon">
          <ion-icon name="location-outline"></ion-icon>
        </div>

        <div class="location-content">
          <strong>Alamat</strong>
          <p>{{ wisata.alamat }}</p>
        </div>
      </div>

      <ion-button
        expand="block"
        fill="outline"
        shape="round"
        color="primary"
        class="map-button"
        (click)="bukaMaps()"
      >
        <ion-icon slot="start" name="map-outline"></ion-icon>

        Buka di Google Maps
      </ion-button>
    </section>

    <div class="bottom-space"></div>
  </div>
  <ng-template #tidakDitemukan>
    <div class="page-container">
      <h1>Tempat tidak ditemukan</h1>
      <ion-button (click)="goBack()">Kembali</ion-button>
    </div>
  </ng-template>
</ion-content>
