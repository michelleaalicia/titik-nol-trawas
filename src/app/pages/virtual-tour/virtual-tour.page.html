<ion-header class="ion-no-border">
  <ion-toolbar>
    <div class="app-brand">
      <img src="assets/icon/logo.png" alt="" />
      <span>Titik Nol Trawas</span>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="virtual-tour-content">
  <main class="page-container">
    <section class="intro">
      <div>
        <h1>Jelajahi Titik Nol Trawas</h1>
        <p>Nikmati pengalaman menjelajahi Titik Nol Trawas secara virtual.</p>
      </div>
    </section>

    <section class="viewer">
      <div class="panorama">
        <iframe
          class="panorama-frame"
          [src]="panoramaUrl"
          loading="eager"
          allowfullscreen
          title="Virtual Tour Panorama 360 Derajat"
        ></iframe>
      </div>
    </section>
  </main>
</ion-content>
